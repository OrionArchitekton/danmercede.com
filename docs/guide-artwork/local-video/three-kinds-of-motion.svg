<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1370" viewBox="0 0 1536 1370"><rect width="1536" height="1370" rx="24" fill="#0c1524"/><text x="64" y="105" font-family="DejaVu Sans,sans-serif" font-size="72" font-weight="700" fill="#6fdcbe">THREE KINDS OF MOTION</text><rect x="64" y="175" width="1408" height="300" rx="22" fill="#172438" stroke="#30445f" stroke-width="3"/><text x="105" y="268" font-family="DejaVu Sans,sans-serif" font-size="68" font-weight="700" fill="#6fdcbe">01</text><text x="260" y="268" font-family="DejaVu Sans,sans-serif" font-size="78" font-weight="700" fill="#e9eff8">Camera</text><text x="105" y="352" font-family="DejaVu Sans,sans-serif" font-size="64" font-weight="400" fill="#b3c3d8">Viewpoint + parallax</text><text x="105" y="427" font-family="DejaVu Sans,sans-serif" font-size="55" font-weight="400" fill="#e9c797">Check for drifting over frozen scenery.</text><rect x="64" y="525" width="1408" height="300" rx="22" fill="#172438" stroke="#30445f" stroke-width="3"/><text x="105" y="618" font-family="DejaVu Sans,sans-serif" font-size="68" font-weight="700" fill="#6fdcbe">02</text><text x="260" y="618" font-family="DejaVu Sans,sans-serif" font-size="78" font-weight="700" fill="#e9eff8">Environment</text><text x="105" y="702" font-family="DejaVu Sans,sans-serif" font-size="64" font-weight="400" fill="#b3c3d8">Water, mist, foliage</text><text x="105" y="777" font-family="DejaVu Sans,sans-serif" font-size="55" font-weight="400" fill="#e9c797">Check for still water or obvious loops.</text><rect x="64" y="875" width="1408" height="300" rx="22" fill="#172438" stroke="#30445f" stroke-width="3"/><text x="105" y="968" font-family="DejaVu Sans,sans-serif" font-size="68" font-weight="700" fill="#6fdcbe">03</text><text x="260" y="968" font-family="DejaVu Sans,sans-serif" font-size="78" font-weight="700" fill="#e9eff8">Performed action</text><text x="105" y="1052" font-family="DejaVu Sans,sans-serif" font-size="64" font-weight="400" fill="#b3c3d8">Walking, turning, gestures</text><text x="105" y="1127" font-family="DejaVu Sans,sans-serif" font-size="55" font-weight="400" fill="#e9c797">Check feet, limbs, and direction.</text><text x="64" y="1294" font-family="DejaVu Sans,sans-serif" font-size="65" font-weight="400" fill="#6fdcbe">Review native speed, then the edit.</text></svg>