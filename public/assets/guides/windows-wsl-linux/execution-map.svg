<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1220" viewBox="0 0 1536 1220" role="img" aria-labelledby="title desc">
  <title id="title">Follow the execution boundary</title>
  <desc id="desc">A Windows workstation contains desktop applications and a WSL2 development environment. WSL sends a bounded computation over SSH to a remote Linux worker and receives its result for local verification.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto-start-reverse"><path d="M2 2 10 6 2 10" fill="none" stroke="#dba77a" stroke-width="2"/></marker>
  </defs>
  <rect width="1536" height="1220" rx="28" fill="#111925"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#f0f3f7">
    <text x="80" y="108" font-size="58" font-weight="700">Follow the execution boundary</text>
    <rect x="80" y="170" width="1376" height="630" rx="22" fill="#192534" stroke="#64748b" stroke-width="3"/>
    <text x="120" y="245" font-size="48" font-weight="700">Windows workstation</text>
    <rect x="130" y="295" width="1276" height="175" rx="16" fill="#253446"/>
    <text x="175" y="365" font-size="48" font-weight="700">Desktop applications</text>
    <text x="175" y="425" font-size="38" fill="#cbd5e1">Editor, browser, native tools, artifact review</text>
    <path d="M768 475 V540" stroke="#dba77a" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="130" y="555" width="1276" height="180" rx="16" fill="#263d48" stroke="#71b7bd" stroke-width="3"/>
    <text x="175" y="625" font-size="48" font-weight="700">WSL2 development environment</text>
    <text x="175" y="685" font-size="38" fill="#cbd5e1">Linux repositories, agent tools, verification</text>
    <path d="M550 800 V905" stroke="#dba77a" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M1020 905 V800" stroke="#dba77a" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="240" y="862" font-size="36" fill="#dba77a">SSH + input</text>
    <text x="1070" y="862" font-size="36" fill="#dba77a">Result</text>
    <rect x="80" y="925" width="1376" height="205" rx="22" fill="#243044" stroke="#8c9ec1" stroke-width="3"/>
    <text x="130" y="1005" font-size="48" font-weight="700">Remote Linux worker</text>
    <text x="130" y="1072" font-size="38" fill="#cbd5e1">Explicit host, user, resources, and job scope</text>
    <text x="80" y="1180" font-size="31" fill="#b6c3d4">An interface, a process, and a machine are different parts of the workflow.</text>
  </g>
</svg>
