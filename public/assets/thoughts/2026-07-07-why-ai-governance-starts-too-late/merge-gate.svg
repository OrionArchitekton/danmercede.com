<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="mgt mgd" font-family="Arial, Helvetica, sans-serif">
  <title id="mgt">Fail-closed merge admission</title>
  <desc id="mgd">Reviewer output enters a deterministic parser that checks for parseability, schema validity, and internal consistency. Anything unparseable, schema-invalid, or self-contradictory halts immediately. Valid output passes to a default-deny policy gate that admits only a clean verdict; everything else halts. Both ADMIT and HALT emit a signed, append-only receipt. A table shows four reviewer outputs and their outcomes: clean admits; truncated, schema-invalid, and contradictory all halt.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16335B"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B23A3A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="700" fill="#FFFFFF"/>
  <text x="40" y="46" font-size="26" font-weight="800" fill="#0B2545">Fail-Closed Merge Admission</text>
  <text x="40" y="74" font-size="15" fill="#5B6675">The reviewer's verdict is an input to be checked, not an authority to be obeyed. Ambiguity halts.</text>

  <!-- untrusted reviewer -->
  <rect x="40" y="120" width="190" height="74" rx="10" fill="#FFFFFF" stroke="#B87333" stroke-width="2"/>
  <text x="135" y="151" text-anchor="middle" font-size="15" font-weight="700" fill="#9A5A20">Reviewer output</text>
  <text x="135" y="172" text-anchor="middle" font-size="12.5" fill="#9A7B5E">untrusted · LLM verdict</text>

  <line x1="230" y1="157" x2="296" y2="157" stroke="#16335B" stroke-width="2.2" marker-end="url(#ar)"/>

  <!-- parser -->
  <rect x="298" y="116" width="230" height="82" rx="10" fill="#0B2545"/>
  <text x="413" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Deterministic parser</text>
  <text x="413" y="168" text-anchor="middle" font-size="12.5" fill="#C9D6E5">parse · schema · consistency</text>
  <text x="413" y="186" text-anchor="middle" font-size="12" fill="#C98A4B">fix-with-no-file → contradiction</text>

  <line x1="528" y1="157" x2="596" y2="157" stroke="#16335B" stroke-width="2.2" marker-end="url(#ar)"/>

  <!-- policy gate -->
  <rect x="598" y="116" width="220" height="82" rx="10" fill="#0B2545"/>
  <text x="708" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Policy gate</text>
  <text x="708" y="174" text-anchor="middle" font-size="12.5" fill="#C98A4B">default-deny · first match</text>

  <!-- admit -->
  <line x1="818" y1="157" x2="900" y2="157" stroke="#1E7A52" stroke-width="2.4" marker-end="url(#ar)"/>
  <text x="858" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#1E7A52">clean</text>
  <rect x="902" y="126" width="160" height="62" rx="10" fill="#EAF1EA" stroke="#1E7A52" stroke-width="1.8"/>
  <text x="982" y="156" text-anchor="middle" font-size="17" font-weight="800" fill="#1E7A52">ADMIT</text>
  <text x="982" y="176" text-anchor="middle" font-size="11.5" fill="#2F6342">merge proceeds</text>

  <!-- halt (parser failure path) -->
  <path d="M413,198 V250 H980 V196" fill="none" stroke="#B23A3A" stroke-width="2.2" marker-end="url(#arR)"/>
  <text x="690" y="244" text-anchor="middle" font-size="12" font-weight="700" fill="#B23A3A">unparseable · schema-invalid · contradictory · non-clean verdict</text>
  <rect x="902" y="250" width="160" height="62" rx="10" fill="#FBEFEF" stroke="#B23A3A" stroke-width="1.8"/>
  <text x="982" y="280" text-anchor="middle" font-size="17" font-weight="800" fill="#B23A3A">HALT</text>
  <text x="982" y="300" text-anchor="middle" font-size="11.5" fill="#B23A3A">merge blocked</text>

  <!-- receipt rail -->
  <rect x="40" y="346" width="1022" height="58" rx="10" fill="#FBF1EA" stroke="#B87333" stroke-width="1.6"/>
  <rect x="60" y="360" width="30" height="30" rx="5" fill="#16335B"/>
  <path d="M67,381 l5,6 l11,-13" fill="none" stroke="#C98A4B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="108" y="381" font-size="14.5" font-weight="600" fill="#0B2545">Both ADMIT and HALT emit a signed, append-only receipt — what was reviewed, what failed the gate, and why.</text>

  <!-- fixtures table -->
  <text x="40" y="452" font-size="17" font-weight="700" fill="#0B2545">The worked example: four reviewer outputs, one admitted</text>
  <g>
    <rect x="40" y="468" width="360" height="44" fill="#0B2545"/>
    <rect x="400" y="468" width="240" height="44" fill="#0B2545"/>
    <rect x="640" y="468" width="422" height="44" fill="#0B2545"/>
    <text x="58" y="496" font-size="14" font-weight="700" fill="#FFFFFF">Reviewer output</text>
    <text x="418" y="496" font-size="14" font-weight="700" fill="#FFFFFF">Outcome</text>
    <text x="658" y="496" font-size="14" font-weight="700" fill="#FFFFFF">Reason code</text>

    <rect x="40" y="512" width="1022" height="42" fill="#EAF1EA"/>
    <rect x="40" y="554" width="1022" height="42" fill="#FBEFEF"/>
    <rect x="40" y="596" width="1022" height="42" fill="#FBEFEF"/>
    <rect x="40" y="638" width="1022" height="42" fill="#FBEFEF"/>

    <g font-size="14" fill="#1A2330">
      <text x="58" y="539">clean verdict, no findings</text>
      <text x="418" y="539" font-weight="700" fill="#1E7A52">ADMIT</text>
      <text x="658" y="539" font-family="'SFMono-Regular',Consolas,monospace" font-size="13" fill="#2F6342">policy_match</text>

      <text x="58" y="581">truncated JSON</text>
      <text x="418" y="581" font-weight="700" fill="#B23A3A">HALT</text>
      <text x="658" y="581" font-family="'SFMono-Regular',Consolas,monospace" font-size="13" fill="#B23A3A">parse_error</text>

      <text x="58" y="623">missing verdict / findings keys</text>
      <text x="418" y="623" font-weight="700" fill="#B23A3A">HALT</text>
      <text x="658" y="623" font-family="'SFMono-Regular',Consolas,monospace" font-size="13" fill="#B23A3A">schema_invalid</text>

      <text x="58" y="665">"fix" verdict, no finding cites a file</text>
      <text x="418" y="665" font-weight="700" fill="#B23A3A">HALT</text>
      <text x="658" y="665" font-family="'SFMono-Regular',Consolas,monospace" font-size="13" fill="#B23A3A">contradiction</text>
    </g>
    <g stroke="#D8D0C4" stroke-width="1.2" fill="none">
      <rect x="40" y="468" width="1022" height="212"/>
      <line x1="400" y1="468" x2="400" y2="680"/>
      <line x1="640" y1="468" x2="640" y2="680"/>
      <line x1="40" y1="512" x2="1062" y2="512"/>
      <line x1="40" y1="554" x2="1062" y2="554"/>
      <line x1="40" y1="596" x2="1062" y2="596"/>
      <line x1="40" y1="638" x2="1062" y2="638"/>
    </g>
  </g>
</svg>
