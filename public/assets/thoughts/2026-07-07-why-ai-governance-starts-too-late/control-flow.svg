<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" role="img" aria-labelledby="d1title d1desc" font-family="Arial, Helvetica, sans-serif">
  <title id="d1title">Where governance sits relative to the state change</title>
  <desc id="d1desc">A two-lane comparison. In post-hoc governance, the agent acts and the state is mutated before any control point; logging, monitoring, alerting and review all happen after the mutation, making them telemetry. In runtime governance, the agent only proposes an intent; an authority gate at the execution boundary evaluates policy, actor and context, then either permits the action (which executes and writes a receipt) or halts it fail-closed.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6675"/>
    </marker>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0B2545"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="620" rx="14" fill="#FFFFFF"/>

  <!-- Heading -->
  <text x="40" y="48" font-size="25" font-weight="700" fill="#0B2545">Where governance sits relative to the state change</text>
  <text x="40" y="76" font-size="15" fill="#5B6675">The execution boundary is the point where intent becomes action. Everything hinges on which side of it governance lives.</text>

  <!-- ===================== LANE A : POST-HOC ===================== -->
  <rect x="30" y="100" width="1120" height="208" rx="12" fill="#F7F9FC" stroke="#D4DAE3"/>
  <text x="52" y="132" font-size="14" font-weight="700" fill="#0B2545" letter-spacing="0.5">POST-HOC GOVERNANCE</text>
  <rect x="232" y="119" width="96" height="20" rx="10" fill="#F6E9E9" stroke="#E0C4C4"/>
  <text x="280" y="133" font-size="11.5" font-weight="700" fill="#B23A3A" text-anchor="middle">telemetry</text>

  <!-- execution boundary A -->
  <line x1="372" y1="150" x2="372" y2="292" stroke="#0B2545" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="372" y="166" font-size="10.5" font-weight="700" fill="#0B2545" text-anchor="middle" letter-spacing="0.4">EXECUTION BOUNDARY</text>

  <!-- box: agent forms intent -->
  <rect x="60" y="200" width="170" height="62" rx="9" fill="#FFFFFF" stroke="#16335B" stroke-width="1.4"/>
  <text x="145" y="236" font-size="14.5" font-weight="600" fill="#16335B" text-anchor="middle">Agent forms intent</text>
  <line x1="230" y1="231" x2="368" y2="231" stroke="#5B6675" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- box: action executes / state mutated -->
  <rect x="394" y="194" width="160" height="74" rx="9" fill="#FBEFEF" stroke="#B23A3A" stroke-width="1.5"/>
  <text x="474" y="222" font-size="14.5" font-weight="700" fill="#B23A3A" text-anchor="middle">Action executes</text>
  <text x="474" y="244" font-size="12.5" fill="#B23A3A" text-anchor="middle">state mutated</text>
  <line x1="554" y1="231" x2="600" y2="231" stroke="#5B6675" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- group: after-the-fact controls -->
  <rect x="606" y="182" width="520" height="98" rx="10" fill="#FFFFFF" stroke="#D4DAE3"/>
  <text x="624" y="203" font-size="12.5" font-weight="700" fill="#5B6675" letter-spacing="0.4">AFTER THE MUTATION</text>
  <g font-size="13.5" fill="#16335B" font-weight="600" text-anchor="middle">
    <rect x="624" y="216" width="104" height="44" rx="8" fill="#F2F5FA" stroke="#D4DAE3"/><text x="676" y="243">Log</text>
    <rect x="742" y="216" width="116" height="44" rx="8" fill="#F2F5FA" stroke="#D4DAE3"/><text x="800" y="243">Monitor</text>
    <rect x="872" y="216" width="104" height="44" rx="8" fill="#F2F5FA" stroke="#D4DAE3"/><text x="924" y="243">Alert</text>
    <rect x="990" y="216" width="120" height="44" rx="8" fill="#F2F5FA" stroke="#D4DAE3"/><text x="1050" y="243">Review</text>
  </g>
  <line x1="728" y1="238" x2="742" y2="238" stroke="#9AA4B2" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="858" y1="238" x2="872" y2="238" stroke="#9AA4B2" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="976" y1="238" x2="990" y2="238" stroke="#9AA4B2" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="866" y="300" font-size="12.5" fill="#5B6675" text-anchor="middle" font-style="italic">First real control point — the change has already happened.</text>

  <!-- ===================== LANE B : RUNTIME ===================== -->
  <rect x="30" y="328" width="1120" height="262" rx="12" fill="#F7F9FC" stroke="#D4DAE3"/>
  <text x="52" y="360" font-size="14" font-weight="700" fill="#0B2545" letter-spacing="0.5">RUNTIME GOVERNANCE</text>
  <rect x="222" y="347" width="104" height="20" rx="10" fill="#EAF1EA" stroke="#C3D8C7"/>
  <text x="274" y="361" font-size="11.5" font-weight="700" fill="#3E7D52" text-anchor="middle">enforcement</text>

  <!-- execution boundary B -->
  <line x1="372" y1="378" x2="372" y2="566" stroke="#0B2545" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="372" y="394" font-size="10.5" font-weight="700" fill="#0B2545" text-anchor="middle" letter-spacing="0.4">EXECUTION BOUNDARY</text>

  <!-- box: agent proposes intent -->
  <rect x="60" y="452" width="170" height="64" rx="9" fill="#FFFFFF" stroke="#16335B" stroke-width="1.4"/>
  <text x="145" y="481" font-size="14.5" font-weight="600" fill="#16335B" text-anchor="middle">Agent proposes</text>
  <text x="145" y="500" font-size="14.5" font-weight="600" fill="#16335B" text-anchor="middle">intent</text>
  <line x1="230" y1="484" x2="392" y2="484" stroke="#5B6675" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- box: authority gate (AT boundary) -->
  <rect x="394" y="446" width="184" height="78" rx="9" fill="#0B2545" stroke="#0B2545"/>
  <text x="486" y="476" font-size="15.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Authority gate</text>
  <text x="486" y="498" font-size="12" fill="#C98A4B" text-anchor="middle">policy · actor · context</text>

  <!-- permit branch -->
  <path d="M578,470 H612 V418 H636" fill="none" stroke="#3E7D52" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="612" y="410" font-size="12" font-weight="700" fill="#3E7D52" text-anchor="middle">permit</text>
  <rect x="638" y="388" width="150" height="60" rx="9" fill="#EAF1EA" stroke="#3E7D52" stroke-width="1.4"/>
  <text x="713" y="423" font-size="14" font-weight="600" fill="#2F6342" text-anchor="middle">Execute action</text>
  <line x1="788" y1="418" x2="826" y2="418" stroke="#3E7D52" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="828" y="388" width="168" height="60" rx="9" fill="#FFFFFF" stroke="#B87333" stroke-width="1.6"/>
  <text x="912" y="415" font-size="14" font-weight="700" fill="#B87333" text-anchor="middle">Receipt written</text>
  <text x="912" y="433" font-size="11.5" fill="#5B6675" text-anchor="middle">in the execution path</text>

  <!-- deny branch -->
  <path d="M578,500 H612 V552 H636" fill="none" stroke="#B23A3A" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="612" y="572" font-size="12" font-weight="700" fill="#B23A3A" text-anchor="middle">deny · ambiguous</text>
  <rect x="638" y="522" width="200" height="58" rx="9" fill="#FBEFEF" stroke="#B23A3A" stroke-width="1.5"/>
  <text x="738" y="549" font-size="14" font-weight="700" fill="#B23A3A" text-anchor="middle">Halt — fail-closed</text>
  <text x="738" y="567" font-size="11.5" fill="#B23A3A" text-anchor="middle">no authority, no mutation</text>

  <text x="1052" y="556" font-size="12.5" fill="#5B6675" text-anchor="end" font-style="italic">Authority is evaluated before the mutation.</text>
</svg>
