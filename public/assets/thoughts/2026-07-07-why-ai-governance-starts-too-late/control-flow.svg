<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" role="img" aria-labelledby="d1title d1desc" font-family="'IBM Plex Sans', system-ui, sans-serif">
  <title id="d1title">Where governance sits relative to the state change</title>
  <desc id="d1desc">A two-lane comparison. In post-hoc governance, the agent acts and the state is mutated before any control point; logging, monitoring, alerting and review all happen after the mutation, making them telemetry. In runtime governance, the agent only proposes an intent; an authority gate at the execution boundary evaluates policy, actor and context, then either permits the action (which executes and writes a receipt) or halts it fail-closed.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#020B29"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="620" rx="14" fill="#FFFFFF"/>

  <!-- Heading -->
  <text x="40" y="48" font-family="'Newsreader', Georgia, serif" font-size="26" font-weight="700" fill="#020B29">Where governance sits relative to the state change</text>
  <text x="40" y="76" font-size="15" fill="#475569">The execution boundary is the point where intent becomes action. Everything hinges on which side of it governance lives.</text>

  <!-- ===================== LANE A : POST-HOC ===================== -->
  <rect x="30" y="100" width="1120" height="208" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="52" y="132" font-family="'JetBrains Mono', monospace" font-size="13.5" font-weight="700" fill="#020B29" letter-spacing="0.5">POST-HOC GOVERNANCE</text>
  <rect x="242" y="118" width="96" height="22" rx="11" fill="#FBEFEF" stroke="#E0C4C4"/>
  <text x="290" y="133" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#B23A3A" text-anchor="middle">telemetry</text>

  <!-- execution boundary A -->
  <line x1="372" y1="150" x2="372" y2="292" stroke="#020B29" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="372" y="166" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#020B29" text-anchor="middle" letter-spacing="0.4">EXECUTION BOUNDARY</text>

  <!-- box: agent forms intent -->
  <rect x="60" y="200" width="170" height="62" rx="9" fill="#FFFFFF" stroke="#020B29" stroke-width="1.4"/>
  <text x="145" y="236" font-size="14.5" font-weight="600" fill="#020B29" text-anchor="middle">Agent forms intent</text>
  <line x1="230" y1="231" x2="368" y2="231" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- box: action executes / state mutated -->
  <rect x="394" y="194" width="160" height="74" rx="9" fill="#FBEFEF" stroke="#B23A3A" stroke-width="1.5"/>
  <text x="474" y="222" font-size="14.5" font-weight="700" fill="#B23A3A" text-anchor="middle">Action executes</text>
  <text x="474" y="244" font-size="12.5" fill="#B23A3A" text-anchor="middle">state mutated</text>
  <line x1="554" y1="231" x2="600" y2="231" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- group: after-the-fact controls -->
  <rect x="606" y="182" width="520" height="98" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="624" y="203" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#475569" letter-spacing="0.4">AFTER THE MUTATION</text>
  <g font-size="13.5" fill="#020B29" font-weight="600" text-anchor="middle">
    <rect x="624" y="216" width="104" height="44" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/><text x="676" y="243">Log</text>
    <rect x="742" y="216" width="116" height="44" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/><text x="800" y="243">Monitor</text>
    <rect x="872" y="216" width="104" height="44" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/><text x="924" y="243">Alert</text>
    <rect x="990" y="216" width="120" height="44" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/><text x="1050" y="243">Review</text>
  </g>
  <line x1="728" y1="238" x2="742" y2="238" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="858" y1="238" x2="872" y2="238" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="976" y1="238" x2="990" y2="238" stroke="#94A3B8" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="866" y="300" font-size="12.5" fill="#475569" text-anchor="middle" font-style="italic">First real control point: the state mutation has already happened.</text>

  <!-- ===================== LANE B : RUNTIME ===================== -->
  <rect x="30" y="328" width="1120" height="262" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="52" y="360" font-family="'JetBrains Mono', monospace" font-size="13.5" font-weight="700" fill="#020B29" letter-spacing="0.5">RUNTIME GOVERNANCE</text>
  <rect x="234" y="346" width="108" height="22" rx="11" fill="#EAF1EA" stroke="#C3D8C7"/>
  <text x="288" y="361" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#2F6342" text-anchor="middle">enforcement</text>

  <!-- execution boundary B -->
  <line x1="372" y1="378" x2="372" y2="566" stroke="#020B29" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="372" y="394" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#020B29" text-anchor="middle" letter-spacing="0.4">EXECUTION BOUNDARY</text>

  <!-- box: agent proposes intent -->
  <rect x="60" y="452" width="170" height="64" rx="9" fill="#FFFFFF" stroke="#020B29" stroke-width="1.4"/>
  <text x="145" y="481" font-size="14.5" font-weight="600" fill="#020B29" text-anchor="middle">Agent proposes</text>
  <text x="145" y="500" font-size="14.5" font-weight="600" fill="#020B29" text-anchor="middle">intent</text>
  <line x1="230" y1="484" x2="392" y2="484" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- box: authority gate -->
  <rect x="394" y="446" width="184" height="78" rx="9" fill="#020B29" stroke="#020B29"/>
  <text x="486" y="476" font-size="15.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Authority gate</text>
  <text x="486" y="498" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#FFC08B" text-anchor="middle">policy, actor, context</text>

  <!-- permit branch -->
  <path d="M578,470 H612 V418 H636" fill="none" stroke="#2F6342" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="612" y="410" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#2F6342" text-anchor="middle">permit</text>
  <rect x="638" y="388" width="150" height="60" rx="9" fill="#EAF1EA" stroke="#2F6342" stroke-width="1.4"/>
  <text x="713" y="423" font-size="14" font-weight="600" fill="#2F6342" text-anchor="middle">Execute action</text>
  <line x1="788" y1="418" x2="826" y2="418" stroke="#2F6342" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="828" y="388" width="168" height="60" rx="9" fill="#E68249" stroke="#020B29" stroke-width="1.6"/>
  <text x="912" y="415" font-size="14" font-weight="700" fill="#020B29" text-anchor="middle">Receipt written</text>
  <text x="912" y="433" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#020B29" text-anchor="middle">in the execution path</text>

  <!-- deny branch -->
  <path d="M578,500 H612 V552 H636" fill="none" stroke="#B23A3A" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="602" y="572" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#B23A3A" text-anchor="end">deny or ambiguous</text>
  <rect x="638" y="522" width="200" height="58" rx="9" fill="#FBEFEF" stroke="#B23A3A" stroke-width="1.5"/>
  <text x="738" y="549" font-size="14" font-weight="700" fill="#B23A3A" text-anchor="middle">Halt (fail-closed)</text>
  <text x="738" y="567" font-size="12" fill="#B23A3A" text-anchor="middle">no authority, no mutation</text>

  <text x="1126" y="556" font-size="12.5" fill="#475569" text-anchor="end" font-style="italic">Authority is evaluated before the mutation.</text>
</svg>
