<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1120" role="img" aria-labelledby="htitle hdesc" font-family="Arial, Helvetica, sans-serif">
  <title id="htitle">Runtime Governance: The Pre-Execution Authority Gate</title>
  <desc id="hdesc">A two-panel infographic. Left, the failure of post-hoc governance: telemetry and probabilistic alerting only observe actions after state mutation, and a comparison table contrasts advisory governance (post-execution, probabilistic, latency-driven) with runtime governance (pre-execution, deterministic ABAC/RBAC, instantaneous halt). Right, the pre-execution control plane: agents sit in isolated enclaves with no direct network access, a default-deny gate halts on any ambiguity, and every decision generates an immutable receipt on an append-only Merkle ledger.</desc>

  <defs>
    <marker id="hArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B87333"/>
    </marker>
  </defs>

  <!-- base -->
  <rect x="0" y="0" width="2000" height="1120" fill="#FFFFFF"/>
  <rect x="0" y="150" width="1000" height="970" fill="#FBF1EA"/>
  <rect x="1000" y="150" width="1000" height="970" fill="#EEF4F8"/>

  <!-- title bar -->
  <text x="1000" y="60" text-anchor="middle" font-size="44" font-weight="800" fill="#0B2545">Runtime Governance: The Pre-Execution Authority Gate</text>

  <!-- sub-header bands -->
  <rect x="0" y="92" width="1000" height="58" fill="#B87333"/>
  <rect x="1000" y="92" width="1000" height="58" fill="#2C6E8F"/>
  <text x="500" y="130" text-anchor="middle" font-size="27" font-weight="700" fill="#FFFFFF">The Failure of Post-Hoc Governance</text>
  <text x="1500" y="130" text-anchor="middle" font-size="27" font-weight="700" fill="#FFFFFF">The Pre-Execution Control Plane</text>

  <!-- center gate / boundary motif -->
  <line x1="1000" y1="150" x2="1000" y2="1120" stroke="#FFFFFF" stroke-width="3"/>
  <line x1="1000" y1="150" x2="1000" y2="1120" stroke="#CBD9E5" stroke-width="1" stroke-dasharray="2 6"/>
  <g>
    <circle cx="1000" cy="210" r="40" fill="#0B2545"/>
    <circle cx="1000" cy="210" r="40" fill="none" stroke="#C98A4B" stroke-width="3"/>
    <rect x="986" y="206" width="28" height="22" rx="3" fill="#FFFFFF"/>
    <path d="M990,206 v-6 a10,10 0 0 1 20,0 v6" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="1000" cy="216" r="3.5" fill="#0B2545"/>
  </g>

  <!-- ===================== LEFT PANEL ===================== -->
  <!-- Block 1 -->
  <text x="48" y="232" font-size="30" font-weight="700" fill="#0B2545">Telemetry Is Not Enforcement</text>
  <text x="48" y="266" font-size="18" fill="#5B6675">Evaluating governance after execution accepts that</text>
  <text x="48" y="291" font-size="18" fill="#5B6675">unauthorized actions have already occurred —</text>
  <text x="48" y="316" font-size="18" fill="#5B6675">creating systemic risk.</text>

  <!-- leaky pipe visual -->
  <rect x="48" y="356" width="560" height="56" rx="28" fill="#EFE0D2" stroke="#B87333" stroke-width="2"/>
  <!-- envelopes drifting in the pipe -->
  <g stroke="#B87333" stroke-width="2" fill="#FFFFFF">
    <rect x="96" y="372" width="34" height="24" rx="3"/><path d="M96,374 l17,12 l17,-12" fill="none"/>
    <rect x="250" y="372" width="34" height="24" rx="3"/><path d="M250,374 l17,12 l17,-12" fill="none"/>
    <rect x="470" y="372" width="34" height="24" rx="3"/><path d="M470,374 l17,12 l17,-12" fill="none"/>
  </g>
  <!-- crack + leak -->
  <path d="M360,356 l-10,28 l14,0 l-10,28" fill="none" stroke="#C0492F" stroke-width="3"/>
  <circle cx="352" cy="430" r="4" fill="#C0492F"/><circle cx="366" cy="444" r="3" fill="#C0492F"/>
  <text x="48" y="452" font-size="14" font-style="italic" fill="#9A7B5E">Leaky data streams</text>
  <!-- alert + probabilistic alerting eye -->
  <path d="M648,360 l26,46 l-52,0 z" fill="#E8A23B" stroke="#B87333" stroke-width="2"/>
  <text x="648" y="398" text-anchor="middle" font-size="22" font-weight="800" fill="#0B2545">!</text>
  <g>
    <ellipse cx="690" cy="372" rx="26" ry="16" fill="#FFFFFF" stroke="#5B6675" stroke-width="2"/>
    <circle cx="690" cy="372" r="7" fill="#5B6675"/>
    <text x="690" y="418" text-anchor="middle" font-size="14" font-style="italic" fill="#5B6675">Probabilistic Alerting</text>
  </g>

  <!-- Block 2 : comparison table -->
  <text x="48" y="544" font-size="27" font-weight="700" fill="#0B2545">Deterministic Constraint vs. Probabilistic Alerting</text>

  <!-- table geometry: c1 x48 w372 | mid x420 w160 | c3 x580 w372  -> 952 -->
  <!-- column base fills -->
  <rect x="48" y="572" width="372" height="392" fill="#F6E7DA"/>
  <rect x="420" y="572" width="160" height="392" fill="#FFFFFF"/>
  <rect x="580" y="572" width="372" height="392" fill="#E4EEF6"/>

  <!-- header row -->
  <rect x="48" y="572" width="372" height="92" fill="#E7D2BF"/>
  <rect x="580" y="572" width="372" height="92" fill="#CFE0EC"/>
  <text x="234" y="614" text-anchor="middle" font-size="19" font-weight="700" fill="#9A5A20">Advisory Governance</text>
  <text x="234" y="640" text-anchor="middle" font-size="17" font-weight="700" fill="#9A5A20">(Telemetry)</text>
  <text x="500" y="626" text-anchor="middle" font-size="19" font-weight="700" fill="#0B2545">Feature</text>
  <text x="766" y="614" text-anchor="middle" font-size="19" font-weight="700" fill="#16335B">Runtime Governance</text>
  <text x="766" y="640" text-anchor="middle" font-size="17" font-weight="700" fill="#16335B">(Enforcement)</text>

  <!-- row: Timing (y 664-764) -->
  <g>
    <circle cx="500" cy="700" r="17" fill="none" stroke="#2C6E8F" stroke-width="2.5"/>
    <path d="M500,690 v11 l8,5" fill="none" stroke="#2C6E8F" stroke-width="2.5" stroke-linecap="round"/>
    <text x="500" y="742" text-anchor="middle" font-size="17" font-weight="700" fill="#0B2545">Timing</text>
    <text x="234" y="703" text-anchor="middle" font-size="17" fill="#3A3A3A">Post-execution</text>
    <text x="234" y="727" text-anchor="middle" font-size="14.5" fill="#7A7A7A">(after state mutation)</text>
    <text x="766" y="703" text-anchor="middle" font-size="17" font-weight="600" fill="#16335B">Pre-execution</text>
    <text x="766" y="727" text-anchor="middle" font-size="14.5" fill="#5B6675">(before state mutation)</text>
  </g>

  <!-- row: Logic (y 764-864) -->
  <g>
    <path d="M500,786 v30 M488,792 h24 M484,800 l4,-8 l4,8 M512,800 l4,-8 l4,8" fill="none" stroke="#2C6E8F" stroke-width="2.2" stroke-linecap="round"/>
    <text x="500" y="842" text-anchor="middle" font-size="17" font-weight="700" fill="#0B2545">Logic</text>
    <text x="234" y="816" text-anchor="middle" font-size="16.5" fill="#3A3A3A">Probabilistic alerts</text>
    <text x="234" y="838" text-anchor="middle" font-size="16.5" fill="#3A3A3A">&amp; scoring</text>
    <text x="766" y="816" text-anchor="middle" font-size="16.5" font-weight="600" fill="#16335B">Deterministic</text>
    <text x="766" y="838" text-anchor="middle" font-size="16.5" font-weight="600" fill="#16335B">ABAC / RBAC rules</text>
  </g>

  <!-- row: Outcome (y 864-964) -->
  <g>
    <circle cx="500" cy="898" r="17" fill="none" stroke="#2C6E8F" stroke-width="2.5"/>
    <path d="M492,898 l5,6 l11,-12" fill="none" stroke="#2C6E8F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="500" y="942" text-anchor="middle" font-size="17" font-weight="700" fill="#0B2545">Outcome</text>
    <text x="234" y="908" text-anchor="middle" font-size="16.5" fill="#3A3A3A">Latency-driven</text>
    <text x="234" y="930" text-anchor="middle" font-size="16.5" fill="#3A3A3A">mitigation</text>
    <text x="766" y="908" text-anchor="middle" font-size="16.5" font-weight="600" fill="#16335B">Instantaneous,</text>
    <text x="766" y="930" text-anchor="middle" font-size="16.5" font-weight="600" fill="#16335B">hardware-isolated halt</text>
  </g>

  <!-- table grid -->
  <g stroke="#C9B8A6" stroke-width="1.4" fill="none">
    <rect x="48" y="572" width="904" height="392"/>
    <line x1="420" y1="572" x2="420" y2="964"/>
    <line x1="580" y1="572" x2="580" y2="964"/>
    <line x1="48" y1="664" x2="952" y2="664"/>
    <line x1="48" y1="764" x2="952" y2="764"/>
    <line x1="48" y1="864" x2="952" y2="864"/>
  </g>

  <!-- ===================== RIGHT PANEL ===================== -->
  <!-- Block 1 : Non-Bypassable Boundary -->
  <text x="1040" y="232" font-size="30" font-weight="700" fill="#0B2545">The Non-Bypassable Boundary</text>
  <text x="1040" y="266" font-size="18" fill="#5B6675">Agents reside in isolated enclaves with no direct</text>
  <text x="1040" y="291" font-size="18" fill="#5B6675">network access — forced to use RPC stubs.</text>

  <!-- hub + enclaves -->
  <circle cx="1500" cy="470" r="9" fill="#16335B"/>
  <g stroke="#9FB6C8" stroke-width="2">
    <line x1="1500" y1="470" x2="1325" y2="400"/>
    <line x1="1500" y1="470" x2="1500" y2="396"/>
    <line x1="1500" y1="470" x2="1675" y2="400"/>
  </g>
  <!-- enclave template (glass box + agent hexagon) x3 -->
  <g>
    <rect x="1270" y="330" width="110" height="92" rx="12" fill="#FFFFFF" stroke="#2C6E8F" stroke-width="2"/>
    <polygon points="1325,348 1352,363 1352,389 1325,404 1298,389 1298,363" fill="#E4EEF6" stroke="#16335B" stroke-width="1.6"/>
    <text x="1325" y="382" text-anchor="middle" font-size="15" font-weight="700" fill="#16335B">AI</text>
  </g>
  <g>
    <rect x="1445" y="326" width="110" height="92" rx="12" fill="#FFFFFF" stroke="#2C6E8F" stroke-width="2"/>
    <polygon points="1500,344 1527,359 1527,385 1500,400 1473,385 1473,359" fill="#E4EEF6" stroke="#16335B" stroke-width="1.6"/>
    <text x="1500" y="378" text-anchor="middle" font-size="15" font-weight="700" fill="#16335B">AI</text>
  </g>
  <g>
    <rect x="1620" y="330" width="110" height="92" rx="12" fill="#FFFFFF" stroke="#2C6E8F" stroke-width="2"/>
    <polygon points="1675,348 1702,363 1702,389 1675,404 1648,389 1648,363" fill="#E4EEF6" stroke="#16335B" stroke-width="1.6"/>
    <text x="1675" y="382" text-anchor="middle" font-size="15" font-weight="700" fill="#16335B">AI</text>
  </g>
  <text x="1500" y="448" text-anchor="middle" font-size="15" font-style="italic" fill="#5B6675">Isolated Enclaves</text>

  <!-- Block 2 : Default-Deny Posture -->
  <text x="1040" y="556" font-size="30" font-weight="700" fill="#0B2545">Default-Deny Posture</text>
  <text x="1040" y="590" font-size="18" fill="#5B6675">If policy is ambiguous or authorization is missing,</text>
  <text x="1040" y="615" font-size="18" fill="#5B6675">the system defaults to an immediate halt.</text>
  <!-- gate + lock icon -->
  <g>
    <rect x="1748" y="540" width="150" height="120" rx="8" fill="#FFFFFF" stroke="#16335B" stroke-width="2.5"/>
    <g stroke="#16335B" stroke-width="2">
      <line x1="1778" y1="546" x2="1778" y2="654"/><line x1="1808" y1="546" x2="1808" y2="654"/>
      <line x1="1838" y1="546" x2="1838" y2="654"/><line x1="1868" y1="546" x2="1868" y2="654"/>
    </g>
    <circle cx="1823" cy="600" r="26" fill="#0B2545"/>
    <rect x="1811" y="596" width="24" height="20" rx="3" fill="#FFFFFF"/>
    <path d="M1815,596 v-5 a8,8 0 0 1 16,0 v5" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>
  </g>

  <!-- Block 3 : Cryptographic Proof of Enforcement -->
  <text x="1040" y="792" font-size="30" font-weight="700" fill="#0B2545">Cryptographic Proof of Enforcement</text>
  <text x="1040" y="826" font-size="18" fill="#5B6675">Every action or denial generates an immutable receipt</text>
  <text x="1040" y="851" font-size="18" fill="#5B6675">on an append-only Merkle tree ledger.</text>

  <!-- chained blocks -->
  <g>
    <!-- chain links -->
    <line x1="1216" y1="940" x2="1276" y2="940" stroke="#9FB6C8" stroke-width="4"/>
    <line x1="1392" y1="940" x2="1452" y2="940" stroke="#9FB6C8" stroke-width="4"/>
    <line x1="1568" y1="940" x2="1628" y2="940" stroke="#9FB6C8" stroke-width="4" stroke-dasharray="6 5"/>

    <!-- block 1: immutable receipt + stamp -->
    <rect x="1120" y="896" width="96" height="88" rx="10" fill="#16335B"/>
    <circle cx="1168" cy="936" r="20" fill="none" stroke="#C98A4B" stroke-width="3"/>
    <path d="M1160,936 l6,7 l12,-14" fill="none" stroke="#C98A4B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1168" y="1012" text-anchor="middle" font-size="15.5" font-weight="600" fill="#16335B">Immutable Receipt</text>

    <!-- block 2: lock -->
    <rect x="1296" y="896" width="96" height="88" rx="10" fill="#2C6E8F"/>
    <rect x="1332" y="934" width="24" height="20" rx="3" fill="#FFFFFF"/>
    <path d="M1336,934 v-5 a8,8 0 0 1 16,0 v5" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>

    <!-- block 3: hash -->
    <rect x="1472" y="896" width="96" height="88" rx="10" fill="#2C6E8F"/>
    <path d="M1512,914 l-6,52 M1534,914 l-6,52 M1498,932 h44 M1494,950 h44" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

    <!-- ledger doc -->
    <rect x="1636" y="896" width="92" height="100" rx="8" fill="#FFFFFF" stroke="#16335B" stroke-width="2.5"/>
    <g stroke="#9FB6C8" stroke-width="3" stroke-linecap="round">
      <line x1="1654" y1="922" x2="1710" y2="922"/><line x1="1654" y1="942" x2="1710" y2="942"/>
      <line x1="1654" y1="962" x2="1690" y2="962"/>
    </g>
    <text x="1682" y="1020" text-anchor="middle" font-size="15.5" font-weight="600" fill="#16335B">Merkle Tree Ledger</text>
  </g>
</svg>
