name: required-checks-fail-closed

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  statuses: read
  checks: read

env:
  BASE_REQUIRED_CHECKS: "build,gitleaks"
  TIMEOUT_MINUTES: "15"
  POLL_INTERVAL_SECONDS: "30"

jobs:
  required-checks-fail-closed:
    name: required-checks-fail-closed
    runs-on: ubuntu-latest
    steps:
      # Self-arming substrate-verify requirement: require the trusted-lane
      # check only once .github/workflows/substrate-verify.yml exists on the
      # PR's BASE branch. On the PR that INTRODUCES that workflow, the base
      # lacks it — and pull_request_target runs base-branch workflows, so the
      # check cannot report on its own introduction PR; requiring it there
      # would deadlock the introduction. The moment the workflow lands on
      # main, every subsequent PR fail-closes on substrate-verify, closing
      # the window where a hand-edit to constants.generated.ts would fail
      # substrate-verify without anything requiring that check.
      - name: Determine required checks (self-arming substrate-verify)
        id: required
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          REQUIRED="${BASE_REQUIRED_CHECKS}"
          if gh api "repos/${REPO}/contents/.github/workflows/substrate-verify.yml?ref=${BASE_SHA}" --silent >/dev/null 2>&1; then
            REQUIRED="${REQUIRED},substrate-verify"
          fi
          echo "checks=${REQUIRED}" >> "$GITHUB_OUTPUT"
          echo "::notice::required checks: ${REQUIRED}"

      - name: Wait for required checks and compute verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REQUIRED_CHECKS: ${{ steps.required.outputs.checks }}
          SHA_CANDIDATES: ${{ github.sha }},${{ github.event.pull_request.merge_commit_sha }},${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time

          def fail(message: str) -> None:
              print(message)
              raise SystemExit(1)

          required_checks = [
              value.strip()
              for value in os.environ.get("REQUIRED_CHECKS", "").split(",")
              if value.strip()
          ]
          if not required_checks:
              fail("REQUIRED_CHECKS is empty.")

          try:
              timeout_minutes = int(os.environ["TIMEOUT_MINUTES"])
              poll_interval_seconds = int(os.environ["POLL_INTERVAL_SECONDS"])
          except (KeyError, ValueError):
              fail(
                  "TIMEOUT_MINUTES and POLL_INTERVAL_SECONDS must be finite positive integers."
              )

          if timeout_minutes <= 0:
              fail(
                  f"TIMEOUT_MINUTES must be a finite positive number, got: {os.environ.get('TIMEOUT_MINUTES')}"
              )
          if poll_interval_seconds <= 0:
              fail(
                  f"POLL_INTERVAL_SECONDS must be a finite positive number, got: {os.environ.get('POLL_INTERVAL_SECONDS')}"
              )

          repo = os.environ["REPO"]
          sha_candidates = []
          for sha in os.environ.get("SHA_CANDIDATES", "").split(","):
              sha = sha.strip()
              if sha and sha not in sha_candidates:
                  sha_candidates.append(sha)

          if not sha_candidates:
              fail("Unable to determine the commit SHA to query for required checks.")

          deadline = time.time() + (timeout_minutes * 60)

          def gh_api(path: str) -> dict:
              output = subprocess.check_output(["gh", "api", path], text=True)
              return json.loads(output)

          def keep_latest(store: dict, name: str, updated_at: str, result: str) -> None:
              current = store.get(name)
              if current is None or updated_at > current[0]:
                  store[name] = (updated_at, result)

          # The verdict is computed ONLY from GitHub Actions check-runs — never
          # from legacy commit statuses. Every required check in this repo
          # (build, gitleaks, substrate-verify, plus this gate) is a GitHub
          # Actions job, so a check-run is always available. Commit statuses
          # are deliberately ignored: the untrusted ci.yml lane runs
          # PR-controlled code, and a same-repo PR whose token carried
          # statuses:write could POST a forged `substrate-verify`/`build`
          # success status that would otherwise shadow a real check-run
          # failure (latest-timestamp-wins). ci.yml now also pins
          # `permissions: contents: read` + `persist-credentials: false` so
          # that token cannot post statuses at all — this gate-side filter is
          # the defense-in-depth backstop.
          GITHUB_ACTIONS_APP_SLUG = "github-actions"

          while time.time() < deadline:
              resolved = {}

              for sha in sha_candidates:
                  check_runs = gh_api(f"repos/{repo}/commits/{sha}/check-runs").get(
                      "check_runs", []
                  )

                  for run in check_runs:
                      if not run or run.get("name") == "required-checks-fail-closed":
                          continue
                      # Only trust check-runs produced by the GitHub Actions
                      # app. A check-run from any other app/integration for a
                      # required-check name is not an accepted substitute.
                      if (run.get("app") or {}).get("slug") != GITHUB_ACTIONS_APP_SLUG:
                          continue
                      if run.get("status") != "completed":
                          continue

                      keep_latest(
                          resolved,
                          run.get("name"),
                          run.get("completed_at")
                          or run.get("started_at")
                          or run.get("created_at")
                          or "",
                          "pass"
                          if run.get("conclusion") in {"success", "neutral", "skipped"}
                          else "fail",
                      )

              failed = [check for check in required_checks if resolved.get(check, ("", ""))[1] == "fail"]
              if failed:
                  fail(f"FAIL: required checks failed: {', '.join(failed)}")

              pending = [check for check in required_checks if check not in resolved]
              if not pending:
                  print("PASS: all required checks succeeded.")
                  raise SystemExit(0)

              print(f"Waiting for: {', '.join(pending)}")
              time.sleep(poll_interval_seconds)

          fail(f"FAIL: timeout waiting for required checks: {', '.join(required_checks)}")
          PY
