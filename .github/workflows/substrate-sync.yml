name: Substrate Sync (fail-loud)

# Regenerates constants.generated.ts from dan-mercede-substrate and opens a
# review PR when the bundle drifts. FAIL-LOUD: if substrate is unreachable OR
# yields 0 canonicals matching surface_targets="danmercede.com", the job halts
# and no PR is opened. This prevents the workflow from ever silently stripping
# substrate-sourced entries from the committed file.

on:
  workflow_dispatch: {}
  schedule:
    # Mondays 08:10 PT (matches the danmercede.online cadence). 15:10 UTC PST /
    # 16:10 UTC PDT — the half-hour drift across the seasonal boundary is
    # acceptable for a weekly sync.
    - cron: '10 15 * * 1'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      TZ: America/Los_Angeles
    steps:
      - name: Checkout danmercede.com
        uses: actions/checkout@v4

      # persist-credentials: false — the substrate PAT is used only for this
      # fetch and never written to the vendored clone's git config, so no
      # later step (including dependency code running during compile) can
      # read it from disk. (The main checkout above keeps its default
      # GITHUB_TOKEN persistence; this workflow runs main's code only.)
      - name: Checkout dan-mercede-substrate (fail-loud)
        uses: actions/checkout@v4
        with:
          repository: OrionArchitekton/dan-mercede-substrate
          token: ${{ secrets.SUBSTRATE_READ_TOKEN }}
          path: vendor/dan-mercede-substrate
          ref: main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile in strict mode (require ≥1 match)
        env:
          SUBSTRATE_PATH: ${{ github.workspace }}/vendor/dan-mercede-substrate
        # --strict: fail on any fatal corruption diagnostic (matched-target
        #   with missing/invalid field, unreadable file, YAML parse failure,
        #   duplicate slug among admitted canonicals). Required so a partial
        #   substrate cannot silently strip a publish-target canonical.
        # --require-matches: fail if substrate has 0 danmercede.com
        #   canonicals. Required for the sync workflow because opening a
        #   refresh PR that deletes all entries would be silent data loss.
        #   CI does NOT set this because the initial seed period has 0
        #   matches and the committed seed is intentional.
        run: npm run compile -- --strict --require-matches

      # Diagram binaries land VERBATIM from substrate (compileContent.ts copyDiagramAsset);
      # the full-resolution originals exceed the per-type image budget that CI enforces
      # (tests/imageBudget.test.ts — jpg<=250KB). Re-encode them to budget HERE, after the
      # copy and before the drift diff, so the opened sync PR carries within-budget assets and
      # passes the build job's `npm test`. Without this the weekly sync PR fails imageBudget and
      # can never merge. sharp is installed on demand (deliberately NOT a package.json
      # dependency — heavy native binaries, no site runtime/CI need) and PINNED so the encode is
      # deterministic: the same originals always yield the same bytes, so a sync with no real
      # substrate change re-derives byte-identical assets and opens no spurious diff (a fixpoint).
      # The optimizer exits non-zero if any over-budget diagram cannot be fit, failing the job
      # loud rather than opening a PR that ships an oversized asset.
      # --ignore-scripts: this job checks out the private substrate and the main checkout
      # persists a contents:write GITHUB_TOKEN in .git/config, so no dependency lifecycle
      # script should run here. sharp >=0.33 ships its native binary as a prebuilt optional
      # dependency (@img/sharp-linux-x64) and loads it at runtime WITHOUT an install script,
      # so --ignore-scripts is safe on the linux-x64 runner. --no-save keeps the manifest and
      # lockfile clean (sharp is deliberately not a site dependency).
      - name: Optimize diagram assets to image budget
        run: |
          npm i -D sharp@0.34.4 --no-save --ignore-scripts --no-audit --no-fund
          node scripts/optimizeDiagrams.mjs --apply

      - name: Diff against committed bundle
        id: diff
        run: |
          # Drift = any change to the generated bundle OR the copied diagram binaries.
          # Use `git status --porcelain` (not `git diff`) so UNTRACKED new diagram assets
          # are detected too: the diagram-aware compiler copies each admitted image into
          # public/assets/diagrams/ (a dir absent until the first diagram sync) and points
          # DIAGRAMS[].src at it, so an asset change must open a PR — else the deployed
          # /diagrams/<slug> page <img> and the sitemap <image:loc> 404.
          if [ -z "$(git status --porcelain -- constants.generated.ts public/assets/diagrams public/assets/thoughts)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No drift detected; constants.generated.ts + diagram assets already match substrate."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Drift detected (bundle and/or diagram assets); opening review PR."
          fi

      - name: Remove vendored substrate before PR
        if: steps.diff.outputs.changed == 'true'
        run: rm -rf vendor/dan-mercede-substrate

      - name: Open review PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          # Use a fine-grained PAT (NOT the default GITHUB_TOKEN) so the opened PR
          # triggers the required Actions checks (build / gitleaks /
          # required-checks-fail-closed). A GITHUB_TOKEN-opened PR leaves those in
          # `action_required` and blocks the merge until a manual close+reopen.
          token: ${{ secrets.SUBSTRATE_SYNC_PR_TOKEN }}
          branch: codex/substrate-sync
          commit-message: 'sync: refresh constants.generated.ts from substrate'
          title: 'sync: refresh constants.generated.ts from substrate'
          body: |
            Automated weekly sync from `dan-mercede-substrate/publishing/canonical/`.

            **Posture:** strict compile succeeded — substrate is reachable and produced ≥1 canonical with `surface_targets: ["danmercede.com"]`. The committed `constants.generated.ts` has drifted from the substrate-produced bundle.

            Review the diff and merge to land the refreshed bundle on `main`. The next Vercel deploy will pick it up.

            If this PR keeps reappearing with the same diff, investigate whether `surface_targets` on the source canonical(s) is intended.

            🤖 Opened by `.github/workflows/substrate-sync.yml`
          # Stage the generated bundle AND the copied diagram binaries together, so a
          # diagram sync PR is self-consistent (DIAGRAMS[].src ↔ a committed file). Staging
          # the directory captures new/changed/removed assets. Without this the PR would
          # ship DIAGRAMS entries whose images are missing → 404 on deploy.
          # NOTE: public/assets/diagrams/.gitkeep keeps this dir tracked so `git add` here
          # does not fail with "pathspec did not match" in a 0-diagram regen (where the
          # compiler copies no binaries). Do not remove that .gitkeep.
          add-paths: |
            constants.generated.ts
            public/assets/diagrams
            public/assets/thoughts
          labels: |
            substrate-sync
          delete-branch: true
