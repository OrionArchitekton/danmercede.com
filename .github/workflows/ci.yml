name: CI

# Untrusted lane (Finding B hardening, 2026-06-09): this workflow runs
# PR-controlled code (npm ci lifecycle scripts, tests, vite config), so it
# carries NO secrets and never checks out the private substrate. Generated-
# bundle verification lives in the trusted lane
# (.github/workflows/substrate-verify.yml, pull_request_target), which runs
# base-branch code only.
#
# `npm run build` triggers prebuild → compile in fail-open mode; with no
# substrate present the compile SKIPs and the committed
# constants.generated.ts is served — the exact same path the Vercel
# production build takes, so CI exercises the deploy path verbatim.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Least-privilege token for the untrusted lane (CI-hardening-2, 2026-06-10).
# This job runs PR-controlled code, so its GITHUB_TOKEN must not be able to
# mutate anything — in particular it must NOT hold statuses:write, or
# PR-controlled npm scripts could POST a forged required-check success
# (e.g. `substrate-verify`) that the fail-closed gate might otherwise honor.
# `contents: read` is the only scope a build+test needs.
permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    env:
      TZ: America/Los_Angeles
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Don't leave the GITHUB_TOKEN in .git/config where PR-controlled
          # code running later in this job could extract and reuse it.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
