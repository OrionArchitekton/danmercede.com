name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    env:
      TZ: America/Los_Angeles
    steps:
      - name: Checkout danmercede.com
        uses: actions/checkout@v4

      - name: Checkout dan-mercede-substrate (fail-open)
        id: checkout-substrate
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: OrionArchitekton/dan-mercede-substrate
          token: ${{ secrets.SUBSTRATE_READ_TOKEN }}
          path: vendor/dan-mercede-substrate
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Run compile separately so we can gate the build on the committed
      # constants.generated.ts matching what substrate would produce. If we
      # let `npm run build` run prebuild→compile inline, a stale/broken
      # committed bundle could be silently rewritten in CI's working tree
      # and the build would pass — while Vercel's fail-open build (which
      # runs without substrate access) would deploy the committed broken
      # bundle. Compile-then-diff catches that drift here.
      - name: Compile from substrate (if available)
        if: steps.checkout-substrate.outcome == 'success'
        env:
          SUBSTRATE_PATH: ${{ format('{0}/vendor/dan-mercede-substrate', github.workspace) }}
        run: npm run compile

      - name: Verify committed constants.generated.ts matches substrate
        if: steps.checkout-substrate.outcome == 'success'
        run: |
          if ! git diff --exit-code -- constants.generated.ts; then
            echo "::error file=constants.generated.ts::Committed constants.generated.ts has drifted from dan-mercede-substrate. Run \`npm run compile\` locally and commit the result, or wait for the substrate-sync workflow to open a refresh PR."
            exit 1
          fi

      # Build with prebuild explicitly skipped — we already compiled above
      # (when substrate is available) or we intentionally want the committed
      # bundle (when substrate is not). Using `npx vite build` bypasses the
      # npm-script `prebuild` hook.
      - name: Build
        run: npx vite build
