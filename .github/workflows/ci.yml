name: CI

# Untrusted lane (Finding B hardening, 2026-06-09): this workflow runs
# PR-controlled code (npm ci lifecycle scripts, tests, vite config), so it
# carries NO secrets and never checks out the private substrate. Generated-
# bundle verification lives in the trusted lane
# (.github/workflows/substrate-verify.yml, pull_request_target), which runs
# base-branch code only.
#
# `npm run build` triggers prebuild → compile in fail-open mode; with no
# substrate present the compile SKIPs and the committed
# constants.generated.ts is served — the exact same path the Vercel
# production build takes, so CI exercises the deploy path verbatim.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Least-privilege token for the untrusted lane (CI-hardening-2, 2026-06-10).
# This job runs PR-controlled code, so its GITHUB_TOKEN must not be able to
# mutate anything — in particular it must NOT hold statuses:write, or
# PR-controlled npm scripts could POST a forged required-check success
# (e.g. `substrate-verify`) that the fail-closed gate might otherwise honor.
# `contents: read` is the only scope a build+test needs.
permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    env:
      TZ: America/Los_Angeles
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Don't leave the GITHUB_TOKEN in .git/config where PR-controlled
          # code running later in this job could extract and reuse it.
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # Round-2 R9: assert the BUILT/served DOM body, not just the emitter.
      # tests/bodyBake.test.ts asserts the renderBodyBlock() emitter string and
      # the source index.html template — it never reads build/ output, so an
      # empty served <body> can ship green (passing-test-masks-prod-bug class).
      # This gate reads the actual built homepage AND a per-route bake
      # (build/proof, build/thoughts) and fails closed if the crawlable body is
      # empty (h1<1 OR p<1), catching both a homepage and a per-route bake
      # regression before deploy.
      - name: Assert built DOM body (round-2 R9)
        run: |
          fail=0
          for f in build/index.html build/proof/index.html build/thoughts/index.html; do
            if [ ! -f "$f" ]; then
              echo "R9 FAIL: $f missing (build did not emit it)"
              fail=1
              continue
            fi
            h1=$(grep -o '<h1' "$f" | wc -l | tr -d ' ')
            p=$(grep -o '<p' "$f" | wc -l | tr -d ' ')
            echo "R9 built-DOM body $f -> h1=$h1 p=$p"
            if [ "$h1" -lt 1 ] || [ "$p" -lt 1 ]; then
              echo "R9 FAIL: $f served body is empty (h1=$h1 p=$p; require h1>=1 AND p>=1)"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "R9 assertion failed: built/served DOM body missing h1/p — empty-body regression."
            exit 1
          fi
          echo "R9 OK: all asserted built pages carry a non-empty crawlable body."

  # A2 — passage-extractability linter as a first-class fail-closed REQUIRED
  # check. It emits a check-run NAMED `extractability`, which
  # required-checks-fail-closed.yml lists in BASE_REQUIRED_CHECKS so a red
  # linter blocks merge. The linter also runs inside `build` (via `npm test`);
  # this dedicated job gives it its own required-check status so the fail-closed
  # gate is a real mirror, not a transitive accident of the aggregate suite.
  # Same untrusted-lane least-privilege token as `build` (contents: read only).
  extractability:
    name: extractability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run extractability linter
        run: npm run test:extractability
