# WebSub freshness push (specs/hub-feed-spec.md scenario 4): after a merge to
# main deploys (Vercel builds on push), tell the hub the feeds changed so
# subscribers (Feedly-class readers) get pushed instead of waiting on a poll.
# Creds-free by construction: pure curl against public origins, NO secrets, no
# third-party actions. Non-blocking: a ping failure is a WARNING, never a gate.
name: WebSub Ping

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the deploy to change the served feed (bounded)
        run: |
          FEED="https://www.danmercede.com/feed.xml"
          # Capture the PRE-deploy baseline with retries: an empty baseline
          # (timeout/error page) must never be compared against, or the first
          # successful poll falsely reads as "changed" and pings before the
          # deploy lands (backported from oia-web #74 review).
          BEFORE=""
          for i in 1 2 3 4 5 6; do
            BEFORE=$(curl -s --max-time 15 "$FEED" | grep -o '<lastBuildDate>[^<]*' || true)
            [ -n "$BEFORE" ] && break
            sleep 15
          done
          echo "pre-deploy lastBuildDate: ${BEFORE:-<none>}"
          if [ -z "$BEFORE" ]; then
            echo "::warning::could not capture a pre-deploy baseline; falling back to a conservative 300s wait"
            sleep 300
            exit 0
          fi
          DEADLINE=$(( $(date +%s) + 480 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            sleep 30
            NOW=$(curl -s --max-time 15 "$FEED" | grep -o '<lastBuildDate>[^<]*' || true)
            if [ -n "$NOW" ] && [ "$NOW" != "$BEFORE" ]; then
              echo "feed changed: $NOW"
              exit 0
            fi
          done
          echo "::warning::served feed unchanged after 480s (slow deploy, or a push with no feed delta); pinging anyway"

      - name: Ping WebSub hub for both feeds
        run: |
          for FEED in "https://www.danmercede.com/feed.xml" "https://www.danmercede.com/atom.xml"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://pubsubhubbub.appspot.com/" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "hub.mode=publish" \
              --data-urlencode "hub.url=${FEED}") || STATUS="000"
            if [ "$STATUS" = "204" ]; then
              echo "WebSub ping accepted for ${FEED}"
            else
              echo "::warning::WebSub ping for ${FEED} returned HTTP ${STATUS}"
            fi
          done
